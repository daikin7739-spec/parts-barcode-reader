name: Publish KMT Mail Intake download

on:
  push:
    paths:
      - ".github/workflows/publish-kmt-mailintake.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified installer package
        env:
          SOURCE_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-5a68-8211-b48f-ccdec88cbc81/raw?se=2026-09-21T05%3A34%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=01a0c26c-535b-776e-9f53-ddb8f4969c17&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T21%3A14%3A06Z&ske=2026-09-21T21%3A14%3A06Z&sks=b&skv=2026-02-06&sig=XAEHnCdeT6Uk4xhKxRVpZ/3kP6Qxk9DMRkKowdN/6Zo%3D"
        run: |
          curl --fail --location --retry 2 "$SOURCE_URL" --output verified-artifact.zip
          echo "169f866beb0584106e8b8c4689656d911547cb8f2a5cd8d2a2cbef2bef913f83  verified-artifact.zip" | sha256sum --check
          unzip -j verified-artifact.zip KMT_MailIntake_MainPC_Setup_v1.3.5.zip business-preview.png home-preview.png part-preview.png addressbook-preview.png
          echo "8b434e5d45a12f4f115febfc35b5aa4029c06d90f12df83dcf5d80c0d8f99dd1  KMT_MailIntake_MainPC_Setup_v1.3.5.zip" | sha256sum --check

      - name: Publish public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="kmt-mail-intake-mainpc-v1.3.5"
          asset="KMT_MailIntake_MainPC_Setup_v1.3.5.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" business-preview.png home-preview.png part-preview.png addressbook-preview.png --clobber
          else
            gh release create "$tag" "$asset" business-preview.png home-preview.png part-preview.png addressbook-preview.png --target "${{ github.sha }}" --title "KMT Mail Intake MainPC v1.3.5 メール名簿の操作・スクロール修正" --notes "共通取込基盤と拠点別の取得設定・メンテ照合を分離した版。195件のテストとWindows画面・インストーラー検査に合格。設定付きインストール・初回起動の自動登録・登録状態表示・画面からの再取込を検証済み。ホームから登録変更、登録管理から組み合わせを編集できるよう修正。実行方法の競合を解消。メール名簿を覆っていた空欄表示を修正し、スクロール・宛先選択・編集保存をWindowsで検証。今日の処理一覧と当日限定スキップを搭載。再起動後も保持し翌日解除。履歴への無人書戻しは未完了です。ブック反映・メールはプレビュー後に実行します。ソース・設定・メール・業務データは含みません。"
          fi
