name: Publish KMT Mail Intake download

on:
  push:
    paths:
      - ".github/workflows/publish-kmt-mailintake.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified installer package
        env:
          SOURCE_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-955c-8211-838b-d9169e5ab08a/raw?se=2026-09-20T08%3A35%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=01a0bddf-b050-7837-9dd6-540f1396187c&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T01%3A57%3A06Z&ske=2026-09-21T01%3A57%3A06Z&sks=b&skv=2026-02-06&sig=sjvEng69C5YllKFZXKjk3S9puxOnAvuMMumBfWXanK0%3D"
        run: |
          curl --fail --location --retry 2 "$SOURCE_URL" --output verified-artifact.zip
          unzip -j verified-artifact.zip KMT_MailIntake_MainPC_Setup_v1.2.0.zip
          echo "1fcd038ec3554c523f336739f74a3524048df76aee936fcc9340a22d96ed3057  KMT_MailIntake_MainPC_Setup_v1.2.0.zip" | sha256sum --check

      - name: Publish public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="kmt-mail-intake-mainpc-v1.2.0"
          asset="KMT_MailIntake_MainPC_Setup_v1.2.0.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "${{ github.sha }}" --title "KMT Mail Intake MainPC v1.2.0" --notes "ログイン不要のメインPC用セットアップZIPです。ソース、設定、メール、保存データは含みません。"
          fi
